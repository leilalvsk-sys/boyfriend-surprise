<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>for my favorite person ♡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="pink-page landing">
  <div class="sparkles"></div>

  <main class="envelope-screen">
    <div class="scribble scribble-left">you<br>+<br>me<br>=<br>forever ♡</div>
    <div class="scribble scribble-right">click<br>yes...<br>→</div>

    <div class="floating-heart h1">♡</div>
    <div class="floating-heart h2">♡</div>
    <div class="floating-heart h3">♡</div>
    <div class="floating-heart h4">✦</div>

    <div class="envelope-wrap" id="envelope">
      <div class="cat-peek">🐱</div>
      <div class="envelope">
        <div class="envelope-flap"></div>
        <div class="envelope-body"></div>
        <div class="envelope-heart">♥</div>
      </div>
    </div>

    <h1>are u my<br>boyfriend? <span>♡</span></h1>

    <div class="choice-row">
      <button class="cute-btn yes-btn" id="yesBtn">Yes ♡</button>
      <button class="cute-btn no-btn" id="noBtn">No</button>
    </div>

    <div class="tiny-cat">ฅ^•ﻌ•^ฅ</div>
    <div class="bottom-doodle">♡━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━♡</div>
  </main>

  <div class="toast" id="toast">nice try... but you're stuck with me ♡</div>

  <script src="script.js"></script>
</body>
</html>
